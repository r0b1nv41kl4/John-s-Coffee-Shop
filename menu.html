<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/style.css">
    <title>John's Menu</title>
</head>
<body>
    <div class="promotions">
        <p>Location: <b>Bilzen, Tanjungbalai</b></p>
        <img src="./src/img/promo.png" class="promo-ban"/>
    </div>
    <main class="menu">
        <div class="search">
        <input type="text" class="search-bar" placeholder="Search Coffee">
        <button class="filter"><img src="./src/assets/filter.svg" alt="Filter"></button>
        </div>

        <div class="coffee-types">
            <button class="selected-coffee-type">All Coffee</button>
            <button class="coffee-type">Macchiato</button>
            <button class="coffee-type">Latte</button>
            <button class="coffee-type">Americano</button>
        </div>

        <div class="menu-items">
            <div class="menu-item">
                <img src="./src/img/coffee1.png" alt="Coffee 1">
                <h2>Espresso</h2>
                <p>A strong and bold coffee shot.</p>
            </div>
            <div class="menu-item">
                <img src="./src/img/coffee2.png" alt="Coffee 2">
                <h2>Cappuccino</h2>
                <p>A perfect blend of espresso, steamed milk, and foam.</p>
            </div>
            <div class="menu-item">
                <img src="./src/img/coffee3.png" alt="Coffee 3">
                <h2>Latte</h2>
                <p>A smooth and creamy coffee with steamed milk.</p>
            </div>
            <div class="menu-item">
                <img src="./src/img/coffee3.png" alt="Coffee 3">
                <h2>Latte</h2>
                <p>A smooth and creamy coffee with steamed milk.</p>
            </div>
        </div>
</body>
</html>
