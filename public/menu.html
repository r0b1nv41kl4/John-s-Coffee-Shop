<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/style.css">
    <title>John's Menu</title>
</head>
<body>
    <div class="promotions">
        <p>Location: <b>Bilzen, Tanjungbalai</b></p>
        <img src="./src/img/promo.png" class="promo-ban"/>
    </div>
    <main class="menu">
        <div class="search">
        <input type="text" class="search-bar" placeholder="Search Coffee">
        <button class="filter"><img src="./src/assets/filter.svg" alt="Filter"></button>
        </div>

        <div class="coffee-types">
            <button class="selected-coffee-type">All Coffee</button>
            <button class="coffee-type">Macchiato</button>
            <button class="coffee-type">Latte</button>
            <button class="coffee-type">Americano</button>
        </div>

        <div class="menu-items">
            <div class="menu-item">
                <img src="./src/img/caffe-mocha.png" alt="Coffee 1">
                <h2>Caffe Mocha</h2>
                <p>Deep Foam</p>
                <div class="price">
                    <h2>$4.53</h2>
                    <a href="/public/item.html" class="buy-button"><img src="./src/assets/plus.svg" alt="Buy"></a>
                </div>
            </div>
            <div class="menu-item">
                <img src="./src/img/flat-white.png" alt="Coffee 2">
                <h2>Flat White</h2>
                <p>Espresso</p>
                <div class="price">
                    <h2>$4.25</h2>
                    <a href="/public/item.html" class="buy-button"><img src="./src/assets/plus.svg" alt="Buy"></a>
                </div>
            </div>
            <div class="menu-item">
                <img src="./src/img/mocha-fusi.png" alt="Coffee 3">
                <h2>Mocha Fusi</h2>
                <p>Ice/Hot</p>
                <div class="price">
                    <h2>$4.75</h2>
                    <a href="/public/item.html" class="buy-button"><img src="./src/assets/plus.svg" alt="Buy"></a>
                </div>
            </div>
            <div class="menu-item">
                <img src="./src/img/caffe-panna.png" alt="Coffee 3">
                <h2>Caffe Panna</h2>
                <p>Ice/Hot</p>
                <div class="price">
                    <h2>$4.75</h2>
                    <a href="/public/item.html" class="buy-button"><img src="./src/assets/plus.svg" alt="Buy"></a>
            </div>
        </div>
    </main>
    <footer>
    <div class="footer">
        <button class="footer-button-selected"><img src="./src/assets/Home.svg" alt="Home"></button>
        <button class="footer-button"><img src="./src/assets/Heart.svg" alt="Favorites"></button>
        <button class="footer-button"><img src="./src/assets/Bag.svg" alt="Cart"></button>
        <button class="footer-button"><img src="./src/assets/Notification.svg" alt="Notifications"></button>
    </div>
</footer>
</body>
</html>
